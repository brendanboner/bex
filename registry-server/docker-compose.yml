version: '3.9'

services:
  registry:
    build:
      context: ..
      dockerfile: registry-server/Dockerfile
    image: bex-skill-registry:latest
    container_name: bex-registry
    restart: unless-stopped
    ports:
      - "${PORT:-5050}:5050"
    environment:
      NODE_ENV: production
      PORT: 5050
      REGISTRY_TOKEN: ${REGISTRY_TOKEN:-bex-registry-token}
      REGISTRY_DATA_DIR: /data
    volumes:
      - registry-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5050/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Optional: Nginx reverse proxy with TLS termination
  # Uncomment and configure for production deployments behind a domain.
  # nginx:
  #   image: nginx:alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./certs:/etc/nginx/certs:ro
  #   depends_on:
  #     - registry

volumes:
  registry-data:
    driver: local
